<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOEWE Editorial Craft · Sample Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;600&family=Space+Mono:wght@400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{--vermilion:#C61D2E;--anagram-blue:#2FB4E7;--paper:#EDE5DE;--paper-soft:#F4EEE7;--velvet:#2B2139;--ink:#1E1B19;--ink-on-velvet:#F2EDE6;--body:#4A4440;--muted:#8A8078;--serif:'Cormorant Garamond','Noto Serif SC',serif;--hand:'Caveat','Ma Shan Zheng',cursive;--grot:'Space Grotesk','PingFang SC',sans-serif;--mono:'Space Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#15101f;overflow:hidden;font-family:var(--grot)}
.deck{position:relative;width:100vw;height:100vh}
.slide{position:absolute;inset:0;display:none;overflow:hidden;transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .4s}
.slide.active{display:block}
.anagram{font-family:var(--serif);font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--anagram-blue)}
.hand-red{font-family:var(--hand);font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--vermilion)}
.serif-title{font-family:var(--serif);font-weight:500;line-height:1.25}
.label-caps{font-family:var(--grot);font-weight:600;font-size:13px;letter-spacing:.23em;text-transform:uppercase}
.mono-cap{font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.body-text{font-family:var(--grot);font-size:16px;line-height:1.65;color:var(--body)}
.ribbon{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck">
<section class="slide active" style="background:var(--velvet)"><div style="position:absolute;left:6%;top:22%"><div class="anagram" style="font-size:88px">LO·EWE</div><div class="serif-title" style="color:var(--ink-on-velvet);font-size:26px;margin-top:24px">EDITORIAL CRAFT</div><div class="hand-red" style="font-size:30px;margin-top:20px">1846 MADRID</div></div><div style="position:absolute;right:14%;top:18%;width:180px;height:180px;background:var(--vermilion)"></div><div class="ribbon"><span>01 / 12</span><span>COVER</span></div></section>
<section class="slide" style="background:var(--paper)"><div style="padding:96px 72px"><div class="label-caps" style="color:var(--vermilion)">CONTENTS</div><div class="serif-title" style="font-size:42px;color:var(--ink);margin-top:24px">目录 · 五个切面</div></div><div class="ribbon"><span>02 / 12</span><span>CONTENTS</span></div></section>
</div>
<div class="hint" style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:#8b7f9e">← → 翻页</div>
<script>
const slides=[...document.querySelectorAll('.slide')];let i=0;
function go(n){i=(n+slides.length)%slides.length;slides.forEach((s,k)=>{s.classList.remove('active');if(k===i){s.classList.add('active');}});}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
document.getElementById('deck').addEventListener('click',()=>go(i+1));
</script>
</body>
</html>
